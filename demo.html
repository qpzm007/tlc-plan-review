 function actualSeries(o){let a=[...o.actual];if(o.id===1){a[2]=st.ship-20;let remain=o.total;return a.map(v=>{let n=Math.min(v,remain);remain-=n;return n})}return a}
 function shipmentInfo(o){let a=actualSeries(o),done=a.slice(0,sampleWeek+1).reduce((x,y)=>x+y,0),due=o.plan.slice(0,sampleWeek).reduce((x,y)=>x+y,0),late=Math.max(0,due-done);let status=done===o.total?'출고 완료':late>0?'납기 지연':o.id%5===4&&sampleWeek<5?'품질 보류':o.id%5===3&&sampleWeek<4?'외주 진행':'정상 진행';let made=sampleWeek===2&&o.id===1?st.good:Math.min(o.total,done+Math.round((o.total-done)*(sampleWeek+2)/10));return{a,done,late,status,made}}

 function machineSamples(){const statuses=['작업 대기','수리 중','가공 중','무인 가동','셋업 중','가공 중','품질 보류','가공 중','비가동','가공 중','가공 중','셋업 중','무인 가동','수리 중','가공 중','작업 대기','가공 중','비가동','가공 중','무인 가동'];const workers=['김작업','박작업','이작업','최작업','정작업','한작업','윤작업','서작업'];return Array.from({length:40},(_,i)=>{let o=orderSamples[i%20],state=statuses[i%20],person=workers[i%8],machinePlant=i<20?'1공장':'2공장',num=String(i%20+1).padStart(2,'0');if(i===0){state=st.paused?'중단':st.running?'가공 중':'작업 대기';if(instruction)person=instruction.worker}let q=i===0?st.good:Math.floor(o.total*(.25+(i%6)*.1)),bad=i===0?st.bad:i%7===0?2:0;return{plant:machinePlant,num,state,person,o,qty:q,bad,process:['1차 가공','2차 가공','정삭','홀 가공'][i%4],issue:state==='수리 중'?(i===1?'스핀들 점검 · 담당 이설비 · 10/21 복구 예정':'냉각장치 점검 · 담당 박설비 · 10/22 복구 예정'):state==='품질 보류'?'초품 치수 재확인 · 품질 승인 대기':state==='비가동'?'배정 작업 없음 · 다음 계획 대기':state==='셋업 중'?'공구·치구 준비 및 초품 확인':state==='작업 대기'?'작업지시 확인 또는 소재 투입 대기':state==='무인 가동'?'무인 가공 계획 · 실제 상태는 현장 확인':'작업지시 기준 생산 진행'};})}
 function machineBoard(){let all=machineSamples(),ms=all.filter(x=>(plant==='전체'||x.plant===plant)&&(machineState==='전체'||x.state===machineState));let count=t=>all.filter(x=>t.includes(x.state)).length;return compactTiles([['등록 장비','40대','1공장 20대 · 2공장 20대'],['가동',count(['가공 중','무인 가동'])+'대',`무인 가동 ${count(['무인 가동'])}대 포함`],['수리·보류·비가동',count(['수리 중','품질 보류','비가동','중단'])+'대','대기·셋업은 별도 상태']])+`<div class="machinefilters"><div>${['전체','1공장','2공장'].map(x=>`<button data-plant="${x}" class="${plant===x?'on':''}">${x}</button>`).join('')}</div><div>${['전체','가공 중','무인 가동','셋업 중','작업 대기','수리 중','품질 보류','비가동','중단'].map(x=>`<button data-machine-state="${x}" class="${machineState===x?'on':''}">${x}</button>`).join('')}</div><small>표시 ${ms.length} / 40대 · 가상 상태 기준 2026.10.19 09:00 · 작업 001은 직접 입력에 반영</small></div><div class="machinegrid expanded">${ms.map(x=>{let inactive=['수리 중','비가동'].includes(x.state),c=['수리 중','품질 보류','중단'].includes(x.state)?'bad':x.state==='셋업 중'||x.state==='작업 대기'?'warn':x.state==='비가동'?'gray':'';return `<div class="machine" data-state="${x.state}" data-machine-id="${x.plant}-${x.num}"><div class="machinehead"><h3>${x.plant} ${x.num}호기</h3>${tag(x.state,c)}</div><small>${x.num%2?'MCT':'CNC'} · ${x.process}</small><p><b>${inactive?'현재 가공품 없음':x.o.part+' · '+x.o.name}</b><small style="display:block">${inactive?'배정 해제 / 복구 후 계획 확인':x.o.partner+' · 작업 '+String(x.o.id).padStart(3,'0')}</small></p><p>${inactive?'관리 담당':'운용 작업자'} <b>${inactive?'이설비':x.person}</b></p>${inactive?'':`<div class="bar"><i style="width:${x.qty/x.o.total*100}%"></i></div><small>양품 ${x.qty} / 계획 ${x.o.total}개 · 불량 ${x.bad}개</small>`}<div class="machineissue">${x.issue}</div><small>가상 예시 · ${x.plant==='1공장'&&x.num==='01'?'입력 연동':'09:00 기록'}</small></div>`}).join('')}</div>${!ms.length?'<div class="notice">선택한 조건의 장비가 없습니다.</div>':''}<div class="notice">입력 기반 장비 현황 샘플입니다. 미갱신과 비가동을 구분하며, 실제 장비 신호는 연결하지 않았습니다.</div>`}
